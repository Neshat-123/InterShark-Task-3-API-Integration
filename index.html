<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>GitHub Explorer</h1>
            <p>Explore GitHub profiles and repositories</p>
        </div>
    </header>


    <main class="container">

        <!-- Search Section -->
        <section class="search-section">

            <h2>Find a GitHub User</h2>

            <form id="searchForm">

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="Enter GitHub username"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

        </section>


        <!-- Loading Message -->
        <div id="loading" class="loading" hidden>
            <p>Loading GitHub data...</p>
        </div>


        <!-- Error Message -->
        <div id="errorMessage" class="error-message" hidden>
            <p id="errorText"></p>
        </div>


        <!-- Profile Section -->
        <section id="profileSection" class="profile-section" hidden>

            <div class="profile-card">

                <img
                    id="profileImage"
                    src=""
                    alt="GitHub profile"
                >

                <div class="profile-info">

                    <h2 id="profileName"></h2>

                    <p id="profileUsername"></p>

                    <p id="profileBio"></p>

                    <div class="profile-stats">

                        <div>
                            <strong id="followers"></strong>
                            <span>Followers</span>
                        </div>

                        <div>
                            <strong id="following"></strong>
                            <span>Following</span>
                        </div>

                        <div>
                            <strong id="repositoryCount"></strong>
                            <span>Repositories</span>
                        </div>

                    </div>

                    <a
                        id="profileLink"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View GitHub Profile
                    </a>

                </div>

            </div>

        </section>


        <!-- Repository Section -->
        <section id="repositorySection" class="repository-section" hidden>

            <div class="repository-header">

                <div>
                    <h2>Repositories</h2>
                    <p id="repositoryTotal"></p>
                </div>

                <input
                    type="text"
                    id="repositorySearch"
                    placeholder="Search repositories..."
                    autocomplete="off"
                >

            </div>


            <!-- Repository Cards -->
            <div
                id="repositoryList"
                class="repository-list"
            >
            </div>


            <!-- No Repository Result -->
            <div id="noRepositories" hidden>
                <p>No repositories found.</p>
            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            GitHub Explorer &copy; 2026
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
